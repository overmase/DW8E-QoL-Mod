; ============================================================
;  真・三國無双7 Empires / Dynasty Warriors 8 Empires  mod 設定 / settings
;  dinput8.dll と一緒に、Launch.exe と同じフォルダに置いてください。
;  Put this file together with dinput8.dll in the folder that contains Launch.exe.
;  書き換えたらゲームを起動し直すと反映されます。 / Restart the game after editing.
;  ; で始まる行は説明です(読み飛ばされます)。 / Lines starting with ; are comments.
;  詳しい説明は README を見てください。 / See README for details. / 詳細請參閱 README.zh-TW.md。
; ============================================================
[Mod]

; ---- 1. 横取りパッチ / Ally officer visibility fix ----
; 味方武将が表示されない不具合の対策。1=使う 0=使わない
; Fixes allied officers not appearing when the unit table is full. 1=on 0=off
StealPatch=1
; 空き枠がこの数以下になったら前倒しで枠を空ける / Start freeing slots when free slots <= this
StealThreshold=3

; ---- 2. 雑魚兵・随伴 / Soldiers and escort squads ----
; 味方の野良雑魚兵 1=有(ゲーム本来) 0=無 / Allied stray soldiers 1=on (vanilla) 0=off
AllyStrayZako=0
; 味方武将の随伴 1=有 0=無 / Escort squads of allied officers 1=on (vanilla) 0=off
AllyEscort=0
; 敵武将の随伴 1=有 0=無 / Escort squads of enemy officers 1=on (vanilla) 0=off
EnemyEscort=0
; 敵の野良雑魚兵(随伴に付いている分)の割合 / Ratio of enemy soldiers linked to escorts
;   0=出ない none  1=30%  2=50%  3=70%  4=100%(ゲーム本来 vanilla)
EnemyLinkedZakoLevel=1
; 敵の随伴の兵の種類(Owner ID)の書き換え 1=する 0=しない
; Replace the unit type (Owner ID) of enemy escort squads. 1=on 0=off
EnemyEscortRewrite=0
; 書き換え先の候補(最大8件、カンマ区切り) 例: SquadId=2065,2070
; Candidate IDs (max 8, comma separated). e.g. SquadId=2065,2070
;   2055,2071,2075,2076,2078,2079,2080,2083,2084 と 2308,2309 は指定できません / cannot be used
SquadId=
; 敵の拠点兵長の随伴 / escort of enemy base captains
; BaseSquadId と RoamingSquadId には 2071 も指定できます / 2071 is allowed only for BaseSquadId and RoamingSquadId
BaseEscortRewrite=0
BaseSquadId=2082,2071
; 敵の遊撃隊長の随伴 / escort of enemy roaming captains
RoamingEscortRewrite=0
RoamingSquadId=

; ---- 3. 固有武将の同時表示の上限 / Unique model limit ----
; エディット武将・無双武将を同時に何人まで固有の見た目で出すか(ゲーム本来は6)。0=使わない。7〜16。試験済み 12 / 14
; How many officers can use their unique models at the same time (vanilla 6). 0=off. 7-16. Tested: 12 / 14
UniqueModelBoxes=14

; ---- 4. 読み込みの表の守り / Load table guard ----
; 読み込みの表(90件)が満杯で落ちるのを防ぐ。1=使う 0=使わない
; Prevents the crash when the 90-entry load table becomes full. 1=on 0=off
LoadTableGuard=1
; 空きがこの数より少ない時は新しい武将の読み込みを待たせる(6 = 1人分)
; Delay loading a new officer while free entries are below this value (6 = one officer)
LoadTableGuardMinFree=6

; ---- 5. ゲーム本来の不具合によるクラッシュの守り / Crash guards for vanilla bugs ----
; 1=使う on  0=使わない off
; 0での割り算(光の演出) / Division by zero in a light effect
CrashGuardDivZero=1
; 密集した所の無双で描画の物体が壊れている / Broken draw object during Musou in crowded areas
CrashGuardBadDraw=1
; 無双の瞬間の演出の部品が空 / Empty effect part at the start of Musou
CrashGuardNullFx=1
; 武将の動きのデータが読めない / Motion data cannot be read
CrashGuardMotion=1
; 範囲外の番号でゲームがわざと落ちる所 / Out-of-range ID that intentionally crashes the game
CrashGuardBadId=1
; 描画の物体の付け替え先が無い / Missing redirect target of a draw object
CrashGuardRedirect=1
; 武将の部品が無い / Missing officer part
CrashGuardNullPart=1

[HpScale]
Mode=1
20=5
21=5
40-45=3
22-28=2
29-30=2
2-10=1.25
BodyOnly=1

; ============================================================
;  画面の文字の位置(画面を 1280×720 とした座標) / On-screen text position (1280x720 coordinates)
; ============================================================
[Message]
; 真ん中の帯(「敵本陣へ進軍し…」など)の縦の位置。元は 348。0〜672
; Vertical position of the center banner (mission messages). Vanilla 348. 0-672
BannerY=590
; 左の会話の窓を縦にずらす量。0=元の位置、プラスで下(-300〜300)
; Move the left dialogue window vertically. 0=vanilla, positive=down (-300 to 300)
TalkOffsetY=95
; 左の会話の窓を横にずらす量。0=元の位置、プラスで右(-600〜900)
; Move the left dialogue window horizontally. 0=vanilla, positive=right (-600 to 900)
TalkOffsetX=-70

; ============================================================
;  右上の地図 / Minimap
; ============================================================
[Map]
; 地図の切り替えボタン(キーボード[.] / Xbox の View)で 全体 → 周辺 → 非表示 の順に切り替える。0=元のまま
; Map toggle button (keyboard [.] / Xbox View) cycles Full -> Local -> Hidden. 0=vanilla (Full/Local only)
ToggleHidden=1
; 周辺地図の中心の位置と大きさ(元は 1049 / 209 / 128)
; Center position and size of the local map (vanilla 1049 / 209 / 128)
SurroundX=1150
SurroundY=120
SurroundSize=128

; ============================================================
;  武器の相性(天・地・人) / Weapon affinity (Heaven / Earth / Man)
; ============================================================
[Affinity]
; 1 = 自分が相性負けの時でも、自分の通常攻撃で敵が怯む。0 = ゲーム本来
FlinchAtDisadvantage=1
; 相性で負けている時のスローの中でも、最低この速さで動く(普段 = 1)。1=スロー無し、0=ゲーム本来。0〜1
; Minimum speed during the affinity slow-motion (normal = 1). 1=no slow, 0=vanilla. 0-1
SlowSpeed=0.84
; 相性で負けている時の「武器切り替えで反撃できる猶予(スロー)」 1=出る(ゲーム本来) 0=出ない
; Counter window (slow-motion) when at an affinity disadvantage. 1=vanilla 0=disabled
CounterWindow=1

; ============================================================
;  味方のHPを左端に表示 / Show allied officers' HP on the left
; ============================================================
[AllyHP]
; 1=出す show  0=出さない hide
Enable=1
; 出す武将の TypeID の範囲(2〜8 = 味方の武将) / TypeID range to show (2-8 = allied officers)
MinID=2
MaxID=8
; 1行目の位置と文字の大きさ(1280×720 の座標、解像度に合わせて拡大) / Position and font size (1280x720 coordinates)
X=12
Y=118
FontSize=15
; 行の間のすき間 / Gap between lines
LineGap=2
; 0=「HP 58%」  1=近くの武将は「HP 58%  90 / 156」 / 1 = also show numbers for nearby officers
ShowMax=0
; 1=名前を出す show names  0=「ID:2」のように番号 show IDs
ShowName=1
; (81) 1 = 一番上に自分の本陣の耐久力を水色で出す(本陣 321)。0 = 出さない
; (81) 1 = show your main camp durability on the first line in light blue (Base 321). 0 = hide
ShowCamp=1
; 日本語版の外字の置き換え(普通は空のまま) / Japanese version only: custom character mapping (leave empty)
Gaiji=
; 表示の入り切りのキー(仮想キーコード、120 = F9、0 = 使わない) / Toggle key (virtual key code, 120 = F9, 0 = none)
ToggleKey=120
; 文字の書体 / Font
FontName=Meiryo

; ============================================================
;  秘計 / Stratagems
; ============================================================
[Stratagem]
; プレイヤーの秘計ゲージ1本の最大値。0=変えない / Max value of one stratagem gauge bar of the player. 0=unchanged
PlayerGaugeMax=5000
; 秘計の再使用までの長さの倍率。1=元のまま、0.5=半分、0=すぐ使える(0〜10)
; Cooldown multiplier. 1=vanilla, 0.5=half, 0=instant (0-10)
;   PlayerCooldown=自分 player / AllyCooldown=味方の武将 allied AI / EnemyCooldown=敵 enemy
PlayerCooldown=0.5
AllyCooldown=0.5
EnemyCooldown=0.5
; AI が秘計を使った後に足される追加の待ち時間の倍率(元は 15〜120 秒)。0=追加なし(0〜10)
; Multiplier of the extra wait added after AI uses a stratagem (vanilla 15-120 s). 0=none (0-10)
AllyExtraWait=0.35
EnemyExtraWait=0.30
; 軍の誰かが秘計を使うと、その軍の全員が 45秒±14秒 使わない。その長さの倍率。0=待ちなし(0〜10)
; After anyone in an army uses a stratagem, the whole army waits 45 +/- 14 s. Multiplier of that wait. 0=none (0-10)
AllyArmyWait=0.35
EnemyArmyWait=0.30
; AI の秘計のポイント(最大8)が 20 秒ごとに増える量(元は 1、0〜8)
; Stratagem points gained by AI every 20 s (max 8, vanilla 1, 0-8)
AllyPointGain=2
EnemyPointGain=2
; 秘計の効果時間の倍率(全ての武将)。0より大きく10以下 / Duration multiplier (all officers). >0 to 10
Duration=1.75
; 「自分と周囲の味方」に効く秘計の範囲の倍率。0より大きく20以下
; Area multiplier of stratagems that affect yourself and nearby allies. >0 to 20
AllyRange=4

; 秘計の種類(TypeID)ごとの倍率(上の倍率にさらに掛ける)。書き方: TypeID=クールタイム倍率,効果時間倍率
; Per-stratagem multipliers, applied on top of the values above. Format: TypeID=cooldown,duration
[StratagemOverride]
60=6,1
20=6,0
47=6,0
59=6,0
58=2,6
50=2,1
41=6,1
49=6,1
; ============================================================
;  オートバトル / Auto battle
; ============================================================
[AutoBattle]
; 1 = キーやパッドのボタンで、プレイヤーの操作を AI(武将と同じ AI)に任せられるようにする。0 = 使わない
; 1 = allow handing the player character to the officer AI with a key or pad buttons. 0 = off
Enable=1
; 入れるキー / 切るキー(仮想キーコード。119 = F8、121 = F10。同じ値にするとそのキーで切り替え)
; Key to turn on / key to turn off (virtual key codes, 119 = F8, 121 = F10; same value = toggle)
KeyOn=119
KeyOff=121
; パッド(XInput)のボタンの同時押しで切り替え。0 = 使わない。足し算で書く(16進):
;   A=0x1000 B=0x2000 X=0x4000 Y=0x8000 LB=0x0100 RB=0x0200 L3=0x0040 R3=0x0080 BACK=0x0020 START=0x0010 LT=0x10000 RT=0x20000
; Pad (XInput) button combination to toggle. 0 = off. e.g. LB+R3 = 0x0180
PadButtons=0
; 1 = オートの間はパッドの操作を止める(普通は 1)。0 = 止めない(試験用)
; 1 = ignore the pad while auto battle is on (normal). 0 = do not (for testing)
BlockPad=1
; (74) オートの間の AI の種類(動く物 +0xDA)。-1 = 武将と同じ決め方にする(普通はこれ)。0〜 = その値に固定(試験用。武将は 0 か 11)
; (74) AI type while auto battle is on (unit +0xDA). -1 = decided the same way as officers (normal). 0+ = force this value (testing; officers use 0 or 11)
AiType=-1
; (72) AI の表の行(動く物 +0xD9)。-1 = 変えない
; (72) AI table row (unit +0xD9). -1 = keep
AiRow=-1
; (72) 1 = 設置物などに引っかかって動けない時、少し横へずれて抜ける。0 = しない
; (72) 1 = step sideways when stuck on objects. 0 = off
Unstuck=1
; (73) 1 = オートの間はプレイヤーに「攻撃してよい」印(動く物 +0xD4 bit4)を付ける。無いと AI が相手に近づくだけで攻撃しない。0 = 付けない
; (73) 1 = give the player the "may attack" flag (unit +0xD4 bit4) while auto battle is on; without it the AI only approaches. 0 = off
AttackFlag=1
PlayerDamageScale=4

; ============================================================
;  カメラ距離(FOV) / Camera distance (FOV)
;  既定値はゲーム本来の値。違う値にすると起動時に書き換えます。
;  Defaults are vanilla values. Change them to adjust the camera.
; ============================================================
[Camera]
; 通常時: 目線・距離・目線の高さ・目線傾き / Normal camera: eye, distance, eye height, eye tilt
NormalEye=700
NormalDistance=700
NormalEyeHeight=180
NormalEyeTilt=-0.1873
; ガード時 / Guard camera
GuardEye=600
GuardDistance=600
GuardEyeHeight=200
GuardEyeTilt=-0.2411

; ============================================================
;  試験中の数値(上級者向け) / Experimental values (advanced)
;  0 = 変えない / 0 = unchanged.  キーの名前は日本語版の場所(英語版・中国語版は自動で対応)
;  Key names are Japanese-version offsets (mapped automatically for the English / Chinese versions).
; ============================================================
[RawValue]
; 元 vanilla = 5000
Val_8A0FB0=4500
; 元 vanilla = 2500
Val_847C00=7500
; 元 vanilla = 20000
Val_8A00EC=10000
; 元 vanilla = 9000
Val_8A21E0=8000

; ============================================================
;  武将情報の画面のゲージ
; ============================================================
[Status]
; 体力・攻撃力・防御力・統率力のゲージの最大値(ゲーム本来は 1000。アイテムなどで 1000 を超えた分も見えるように)。
GaugeMax=2000
; 武将の能力(体力・攻撃力・防御力・統率力)の上限(ゲーム本来は 1000)。能力を上げるアイテムで 1000 を超えて上がるようにする(1000〜30000)。
StatMax=2000
; 能力の強化の段階の最低の値(0〜31、0 = ゲーム本来)。敵の能力は (難易度の値 + 段階) の 2 乗で決まる。フリーモードは 1、レイドイベントは 5 ほど。
; 「1-6」のように書くと、戦闘ごとにその範囲から選ぶ。キャラクターごとの能力の元を変えるので、敵だけでなく味方の武将・兵にも効く。
; (ini はゲームの起動時に読みます)
; Minimum stat "rank" (0-31, 0 = vanilla), or a range like 1-6 (picked per battle). Affects allies as well as enemies.
StatRank=2-6

; ============================================================
;  AI
; ============================================================
[AI]
; AI の強さ(0〜15)。ゲームは 難易度(天国1・易しい1・普通3・難しい5・修羅7)+ 武将の格 + 軍の勢い で決める。最大 15。
; 武将はもともと 15(最大)。兵などに効く。LevelAdd = 足す数(-15〜15)/ LevelMin = 最低の値(0〜15)。
AllyLevelAdd=15
AllyLevelMin=0
EnemyLevelAdd=15
EnemyLevelMin=0
; (84) 空中に飛ばされている武将が受け身を取る確率(0〜100 %)。-1 = ゲームのまま(行動 3。倒れている時の行動 0x1F も同じ確率)
;      (ゲームは AI の強さで 0 / 12 / 25 / 50 %。AI の強さ 15 なら 50 %)
; (84) Chance (0-100 %) that a juggled officer air-recovers (action 3; also action 0x1F when downed). -1 = vanilla (50 % at AI level 15)
AirRecoverChance=70
; (89) 空中の行動(武将のみ)。ボタンを押させる確率(%)を 無双 / チャージ攻撃 / 攻撃 / ジャンプ で指定し、残りは何もしない(合計 100 まで)。
; (89) Aerial actions (officers only). Chance (%) of Musou / charge / attack / jump; the rest = nothing (total up to 100).
;   受け身を取った後(AirActionDelay フレーム後) / After air recovery
AirAfterMusou=40
AirAfterCharge=40
AirAfterAttack=0
AirAfterJump=20
;   受け身できずに空中に飛ばされ続けた時(AirStuckFrames フレーム続いたら。0 = しない) / When juggled without recovering for AirStuckFrames frames (0 = off)
AirStuckFrames=180
AirStuckMusou=100
AirStuckCharge=0
AirStuckAttack=0
AirStuckJump=0
; (89) 受け身を選んでからボタンを押すまでのフレーム数(0〜600、60 = 1 秒)。早すぎると受け身が出なくなる
; (89) Frames between choosing air recovery and pressing the button (0-600, 60 = 1 s). Too early cancels the recovery
AirActionDelay=16
; (89) ボタンを押し続けるフレーム数: 無双 / それ以外(1〜120)
; (89) Frames the button is held: Musou / others (1-120)
AirMusouFrames=24
AirButtonFrames=24

; ============================================================
;  敵の兵長・兵の強さ / Enemy captains and soldiers
; ============================================================
[EnemyPower]
; (76) プレイヤーの敵の 拠点兵長・遊撃隊長・兵(武将の随伴・拠点の兵など)が与えるダメージの倍率。1 = ゲーム本来、2 = 2倍(0〜20)。武将は対象外。
; (76) Damage multiplier for enemy base captains / roaming captains / soldiers (not officers). 1 = vanilla (0-20)
BaseCaptainDamage=6
RoamingCaptainDamage=6
SoldierDamage=6
; (79) 敵の兵長・兵だけ、AI が考える時の難易度を置き換える。-1 = そのまま、0 = 天国 … 5 = 修羅(難易度で攻撃の頻度が変わるため)
; (79) Difficulty used by the AI of enemy captains / soldiers only. -1 = keep, 0 = easiest ... 5 = hardest (Shura)
BaseCaptainDifficulty=-1
RoamingCaptainDifficulty=-1
SoldierDifficulty=-1
; (79) AI の表の行(動く物 +0xD9)を固定する。-1 = そのまま。兵は 天国で 0、修羅で 15 が多かった(行で行動の選び方が変わる)
; (79) Force the AI table row (unit +0xD9). -1 = keep. Soldiers were mostly 0 on the easiest and 15 on Shura
BaseCaptainAiRow=-1
RoamingCaptainAiRow=-1
SoldierAiRow=-1

; ============================================================
;  拠点を攻める速さ / Base capture speed
; ============================================================
[BaseCapture]
; AI の武将が敵の拠点にいる時に、拠点の耐久力を減らす速さの倍率(画面外の戦闘で拠点を落とす速さ)。
; 1 = ゲーム本来、2 = 2倍の速さ、0.5 = 半分、0 = 減らさない(0〜10)。プレイヤーは対象外。
;   AllySpeed = 味方の武将が敵の拠点を攻める速さ / EnemySpeed = 敵の武将が味方の拠点を攻める速さ
AllySpeed=2
EnemySpeed=3

; ============================================================
;  AI の相手 / AI targeting
; ============================================================
[AITarget]
; 1 = 武将の AI は「攻撃してきた相手」の次に「NearRange 以内で一番近い敵の武将(プレイヤーを含む)」を狙う。0 = ゲーム本来。
OfficerNearest=1
NearRange=1250
; 同じ相手を選んだまま、この秒数 自分がほとんど動かず近づけもしない時(立ち止まり・届かない場所)は、その相手を 15 秒だけ外す。0 = しない
; If the officer stays still and cannot get closer to the same target for this many seconds, skip that target for 15 s. 0 = off
StuckSeconds=3
; 0 = 一番近い敵の武将を探す時にプレイヤーを数えない(後ろの武将までプレイヤーに集まるのを防ぐ。攻撃された時の仕返しはそのまま)。1 = 数える
; 0 = ignore the player when looking for the nearest enemy officer (revenge on the player still works). 1 = include the player
NearIncludePlayer=0
; 敵の AI が相手を探す時、最初に「近くのプレイヤー」を探す確率(0〜100 %)。100 = ゲーム本来。
; 下げると、近くの味方武将や兵も狙うようになる(プレイヤーが攻撃した時の仕返しはそのまま)。
EnemyPlayerFirst=0

; ============================================================
;  画面外の進軍の速さ / Off-screen march speed
; ============================================================
[OffscreenMarch]
; (83) 戦場に出ていない(画面の外の)武将の進軍の速さの倍率。味方 = プレイヤーと同じ軍。1 = ゲーム本来(0.1〜10)
; (83) March speed of officers not spawned on the field (off-screen). Ally = the player's army. 1 = vanilla (0.1-10)
AllySpeed=1.50
EnemySpeed=1.75
; (83) 本陣を守りに戻る時(防御の命令で目標が自分の本陣)は、上の倍率にさらにこの倍率を掛ける
; (83) Extra multiplier while returning to defend their own main camp
AllyDefendSpeed=1.75
EnemyDefendSpeed=2

; ============================================================
;  本陣の防衛 / Main camp defense
; ============================================================
[MainCamp]
; 本陣が攻められたら(本陣の耐久力が減ったら)、その軍の武将(プレイヤー以外)に本陣を守る命令を出す。1=する 0=しない
AllyDefend=1
EnemyDefend=1
; 攻められなくなってこの秒数たったら、前の命令に戻す。0 = 戻さない
ReleaseSeconds=25
; 本陣の近くとみなす距離。この中に敵の武将(プレイヤーを含む)がいる間は「攻められている」とする(遠くからの拠点ダメージでは反応しない)
Radius=2000
; 1 = 本陣へ戻る途中の武将(と随伴の兵)は、本陣から Radius 以内に入るまで戦わない(途中の敵に足止めされない)。0 = 途中でも戦う
; 1 = officers returning to defend do not fight until they are within Radius of the main camp. 0 = they may fight on the way
NoFightOnWay=1
