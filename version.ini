; ============================================================
;  オートバトル / Auto battle
; ============================================================
[AutoBattle]
; 1 = キーやパッドのボタンで、プレイヤーの操作を AI(武将と同じ AI)に任せられるようにする。0 = 使わない
; 1 = allow handing the player character to the officer AI with a key or pad buttons. 0 = off
Enable=1
; 入れるキー / 切るキー(仮想キーコード。119 = F8、121 = F10。同じ値にするとそのキーで切り替え)
; Key to turn on / key to turn off (virtual key codes, 119 = F8, 121 = F10; same value = toggle)
KeyOn=119
KeyOff=121
; パッド(XInput)のボタンの同時押しで切り替え。0 = 使わない。足し算で書く(16進):
;   A=0x1000 B=0x2000 X=0x4000 Y=0x8000 LB=0x0100 RB=0x0200 L3=0x0040 R3=0x0080 BACK=0x0020 START=0x0010 LT=0x10000 RT=0x20000
; Pad (XInput) button combination to toggle. 0 = off. e.g. LB+R3 = 0x0180
PadButtons=0
; 1 = オートの間はパッドの操作を止める(普通は 1)。0 = 止めない(試験用)
; 1 = ignore the pad while auto battle is on (normal). 0 = do not (for testing)
BlockPad=1
; (74) オートの間の AI の種類(動く物 +0xDA)。-1 = 武将と同じ決め方にする(普通はこれ)。0〜 = その値に固定(試験用。武将は 0 か 11)
; (74) AI type while auto battle is on (unit +0xDA). -1 = decided the same way as officers (normal). 0+ = force this value (testing; officers use 0 or 11)
AiType=-1
; (72) AI の表の行(動く物 +0xD9)。-1 = 変えない
; (72) AI table row (unit +0xD9). -1 = keep
AiRow=-1
; (72) 1 = 設置物などに引っかかって動けない時、少し横へずれて抜ける。0 = しない
; (72) 1 = step sideways when stuck on objects. 0 = off
Unstuck=1
; (91) 引っかかりを調べる長さ(秒、1〜10)。この間に下の UnstuckDistance しか動いていない、または行ったり来たりしているだけなら「引っかかった」とみなす
;      その間に攻撃を受けた・自分で攻撃した時は数えない(その場で戦っている・つかまれている時の誤判定を防ぐ)
; (91) Check window (s, 1-10). Not counted if hit or attacking during it
UnstuckSeconds=3
; (90) 引っかかった時、横へずれる時間(ミリ秒、200〜10000)/ その後 前へ進みながらジャンプを繰り返す時間(0 = ジャンプしない、〜10000)
; (90) Sideways step time when stuck (ms) / then time to move forward while jumping (0 = no jump)
UnstuckSideMs=1500
UnstuckJumpMs=750
; UnstuckSeconds の間にこの距離しか動いていなければ「引っかかった」とみなす(50〜2000)。歩いた道のりがこの 3 倍以上あるのに 3 割しか進んでいない(左右に行ったり来たり・ぐるぐる)時も
; Stuck if it moved less than this in UnstuckSeconds, or walked 3x this but made under 30 % net progress (back and forth / circling)
UnstuckDistance=275
; (73) 1 = オートの間はプレイヤーに「攻撃してよい」印(動く物 +0xD4 bit4)を付ける。無いと AI が相手に近づくだけで攻撃しない。0 = 付けない
; (73) 1 = give the player the "may attack" flag (unit +0xD4 bit4) while auto battle is on; without it the AI only approaches. 0 = off
AttackFlag=1
PlayerDamageScale=3.15
; (90) オートの間、AI が押してもプレイヤーには入れないボタンのビット(0〜63、カンマ区切り。mod_status の「ボタンのビット」の番号)。空 = 全部入れる
; (90) Button bits (0-63, comma separated, see "ボタンのビット" in mod_status) the AI may not press for the player during auto battle. Empty = allow all
BlockAiBits=
; (92) 1 = オートの間は 射撃槽などの設置物を置きに行かない(AI の「設置物を置きに行く」行動 0x27 を選ばせない)。0 = 置く
; (92) 1 = do not go to place installations (archer towers etc.) during auto battle. 0 = allow
NoInstall=1


; ============================================================
;  争覇モード / Conquest mode
; ============================================================
[Conquest]
; (93) 経験値の倍率(0〜100、1 = ゲーム本来、2 = 2倍、0.5 = 半分)。増える時だけ掛ける。総合経験値の上限 999999 はそのまま
;   ExpBattle  = 戦場から帰った時(自分も味方の武将も)。結果の画面の数字も変わる(1 人 1 回 32767 まで)
;   ExpCommand = コマンドで手に入る分(訓練・全軍特訓など)。コマンドの表示の数字も変わる
;   ExpMission = 戦場の中のミッション(「誰々を何分以内に倒せ」「拠点を奪え」など)
; (93) Experience multipliers (0-100, 1 = vanilla): returning from battle (all officers) / commands (training etc.) / in-battle missions
ExpBattle=1.5
ExpCommand=1.15
ExpMission=1
; (96) コマンド(訓練・全軍特訓など)の経験値を ±この % の乱数でばらつかせる(0〜100、0 = ばらつかせない。例 20 = 0.8〜1.2 倍)。
;      コマンドの表示の数字も同じ値になり、コマンドで経験値が入るたびに乱数を引き直す
; (94) Random spread for command experience, ±% (0-100, 0 = none)
ExpCommandRandom=45
; (95) 戦場から帰った時の経験値を 1 人ずつ ±この % の乱数でばらつかせる(0〜100、0 = ばらつかせない)。結果の画面の数字も同じ値になる
; (95) Random spread for battle experience, ±% per officer (0-100, 0 = none). The result screen shows the same value
ExpBattleRandom=45
; (97) 資源・金・兵力の上限(0〜999999、0 = ゲーム本来の 999999)。自国 = 自分の国(在野の時は自分の分)/ Enemy = それ以外の全部の国
;      これより多くなったら上限に戻す(超えた分は無くなる)
; (97) Caps for supplies / troops / gold (0-999999, 0 = vanilla 999999). Own country / all other countries
MaxSupplies=50000
MaxTroops=50000
MaxGold=50000
EnemyMaxSupplies=100000
EnemyMaxTroops=100000
EnemyMaxGold=100000
; (97) 1 = 自分の資源が増える所を mod_status.txt に記録する(コマンド・依頼の報酬の倍率を作るための調べ)。0 = しない
; (97) 1 = record where your resources are added (for research). 0 = off
ResourceLog=1
