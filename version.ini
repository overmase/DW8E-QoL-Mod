;   AllySpeed = 味方の武将が敵の拠点を攻める速さ / EnemySpeed = 敵の武将が味方の拠点を攻める速さ
AllySpeed=2
EnemySpeed=2.5

; ============================================================
;  AI の相手 / AI targeting
; ============================================================
[AITarget]
; 1 = 武将の AI は「攻撃してきた相手」の次に「NearRange 以内で一番近い敵の武将(プレイヤーを含む)」を狙う。0 = ゲーム本来。
OfficerNearest=1
NearRange=3000
; (243) 護衛の武将(護衛要請などで連れている武将)が狙う敵の武将の距離。この距離以内に敵の武将がいれば狙い、いなければゲームに任せる(兵や隊長と戦う)。0 = 護衛の武将はいつもゲームに任せる。OfficerNearest=1 の時だけ。大きくしすぎると 護衛でプレイヤーから離れられず立ったままになります(3000 で確認)。おすすめ 600〜1000
; (243) Escorting officers (e.g. from an escort request) target enemy officers within this range; otherwise the game picks. 0 = always the game. Needs OfficerNearest=1. Too large = they stand still (seen at 3000). Suggested 600-1000
EscortNearRange=800
; 同じ相手を選んだまま、この秒数 自分がほとんど動かず近づけもしない時(立ち止まり・届かない場所)は、その相手を 15 秒だけ外す。0 = しない
; If the officer stays still and cannot get closer to the same target for this many seconds, skip that target for 15 s. 0 = off
StuckSeconds=0
; 0 = 一番近い敵の武将を探す時にプレイヤーを数えない(後ろの武将までプレイヤーに集まるのを防ぐ。攻撃された時の仕返しはそのまま)。1 = 数える
; 0 = ignore the player when looking for the nearest enemy officer (revenge on the player still works). 1 = include the player
NearIncludePlayer=0
; 敵の AI が相手を探す時、最初に「近くのプレイヤー」を探す確率(0〜100 %)。100 = ゲーム本来。
; 下げると、近くの味方武将や兵も狙うようになる(プレイヤーが攻撃した時の仕返しはそのまま)。
EnemyPlayerFirst=0
; (90) 敵が近くにいるのに この秒数 立ったまま動かない武将に、相手を選び直させる(相手が倒れている・遠すぎる時は相手も外す)。0 = しない(0〜60)
; (90) Officers standing still for this many seconds with enemies nearby are made to pick a new target. 0 = off (0-60)
IdleSeconds=5
; 1 = 兵(拠点兵長・遊撃隊長・兵)にも同じことをする / 1 = also apply to captains and soldiers
IdleIncludeSoldiers=0
; (262) 1 = HP が 0 になった相手(倒れた体)を AI が狙い続けない。狙っていたら外して選び直させる(打ち上げ続けて体が消えず、先へ進まないのを防ぐ)
