; Overwrite records of objects spawned by attack stratagems: id.offset(hex)=value (with a decimal point = 4-byte float, otherwise 16-bit)

; ============================================================
;  (248) 手当て / Rescue heal
;  依頼戦の「これで手当てしろ」のように、HP の少ない味方の武将に近づくと回復させる / Heal low-HP allied officers when you get close
; ============================================================
[Rescue]
; 1 = 使う / 1 = on
Enable=1
; HP がこの % より少ない味方の武将(プレイヤー以外)/ Allied officers below this HP %
HpBelow=50
; プレイヤーがこの距離まで近づいたら / Distance from you
Range=500
; この % まで回復 / Heal up to this %
HealTo=100
; 同じ武将はこの秒数あける / Seconds before the same officer can be healed again
Cooldown=120
