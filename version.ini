; 一番長い時 = 100 + HpBarWidth × HpBarMaxHP ÷ 1000(点、横1280 の座標)。画面からはみ出す時は HpBarWidth を下げる(1150〜1200 点くらいまでが目安)。
; (141) Own HP gauge bar. Vanilla length = 100 + max HP x 0.7, stopping at 1000 HP. HpBarMaxHP = HP where it stops growing, HpBarWidth = length per 1000 HP.
HpBarMaxHP=2000
HpBarWidth=540
; (143) 敵の武将(ターゲットした時の左上)の HP ゲージの絵の長さ。ゲームは 長さ = 100 + 最大HP × 0.3(点)で、最大HP 1000 で止める(400 点)。
; TargetBarMaxHP = この最大HP まで伸びる(ゲーム本来 1000)/ TargetBarWidth = 最大HP 1000 あたりの長さ(ゲーム本来 300)
; (143) Targeted enemy officer HP bar (top left). Vanilla length = 100 + max HP x 0.3, stopping at 1000 HP.
TargetBarMaxHP=3000
TargetBarWidth=300
; (145) 1 = 敵の武将の HP ゲージに [HpScale] の倍率も足す。Mode=1(受けるダメージを減らす)は 最大HP を変えないので、そのままではゲージが伸びない。
