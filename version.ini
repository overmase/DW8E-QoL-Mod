; (257) Switch motions: 0 = vanilla / 1 = AI cannot enter SwitchAttackMotions / 2 = replace motions by SwitchReplace (from:to, affects everyone)
AISwitch=1
SwitchAttackMotions=817,818,848
SwitchReplace=848:847
; (261) AI の武将も 狙っている敵の武将より相性が有利でなければ R1 で武器を切り替える(1 = する)。味方 / 敵 を別に
;       範囲は [AutoBattle] AffinitySwitchRange と同じ。同じ武将が次に切り替えるまでの最短の間隔(ミリ秒)
; (261) AI officers also press R1 when their affinity is not advantageous against the targeted enemy officer (ally / enemy)
AffinitySwitchAlly=1
AffinitySwitchEnemy=1
AffinitySwitchCooldownMs=20000
; (92) 1 = 命令の目標が無くなって止まっている武将の部隊に、次の命令を出す(全ての拠点を取った後・取り返された時など)。
;      部隊から一番近い自軍でない拠点を攻める命令、無ければ一番近い敵の武将の部隊を撃破する命令。プレイヤーの部隊と本陣の防衛中は触らない
; (92) 1 = give a new order (nearest base not ours, or nearest enemy officer unit) to officer units whose target is gone. Ally / Enemy
AllyAutoOrder=1
EnemyAutoOrder=1
; (84) 空中に飛ばされている武将が受け身を取る確率(0〜100 %)。-1 = ゲームのまま(行動 3。倒れている時の行動 0x1F も同じ確率)
;      (ゲームは AI の強さで 0 / 12 / 25 / 50 %。AI の強さ 15 なら 50 %)
; (84) Chance (0-100 %) that a juggled officer air-recovers (action 3; also action 0x1F when downed). -1 = vanilla (50 % at AI level 15)
AirRecoverChance=90
; (89) 空中の行動(武将のみ)。ボタンを押させる確率(%)を 無双 / チャージ攻撃 / 攻撃 / ジャンプ で指定し、残りは何もしない(合計 100 まで)。
; (89) Aerial actions (officers only). Chance (%) of Musou / charge / attack / jump; the rest = nothing (total up to 100).
;   受け身を取った後(AirActionDelay フレーム後) / After air recovery
AirAfterMusou=25
AirAfterCharge=40
AirAfterAttack=15
AirAfterJump=20
;   受け身できずに空中に飛ばされ続けた時(最初に空中になってから AirStuckFrames フレームたったら。60 = 1 秒、0 = しない) / When juggled without recovering for AirStuckFrames frames since first launched (60 = 1 s, 0 = off)
AirStuckFrames=0
; (91) この間(ミリ秒)空中を見なければ数え直す(100〜10000)。追い打ちの合間に一瞬着地しても続けて数える / Reset the count if not seen airborne for this long (ms)
AirStuckGapMs=6000
AirStuckMusou=15
AirStuckCharge=5
AirStuckAttack=5
AirStuckJump=75
; (89) 受け身を選んでからボタンを押すまでのフレーム数(0〜600、60 = 1 秒)。早すぎると受け身が出なくなる
; (89) Frames between choosing air recovery and pressing the button (0-600, 60 = 1 s). Too early cancels the recovery
AirActionDelay=18
; (89) ボタンを押し続けるフレーム数: 無双 / それ以外(1〜120)
; (89) Frames the button is held: Musou / others (1-120)
AirMusouFrames=28
AirButtonFrames=28
; (208) 空中でやられ続けた時の対策(無限コンボ対策)。空中でやられている状態がこの秒数続いたら 受身できるようにし、武将はガード(受身のボタン)を押して受身をとる。0 = 使わない
; (208) Anti infinite juggle: after being juggled this many seconds, air recovery is allowed (officers press guard to recover). 0 = off
AirEscapeSeconds=2.0
; (208) 1 = 上の受身の後に 空中無双を出す(無双ゲージが要る)/ 1 = use air musou right after that recovery
AirEscapeMusou=1
; (208) 1 = プレイヤーも同じ秒数で受身できるようにする(L1 で受身)/ 1 = also let the player recover (press guard)
AirEscapePlayer=1
; (214) 空中で飛ばされている状態がこの間(ミリ秒)見えなくても 続けて数える(追い打ちの合間・一瞬の着地。200〜10000)
; (214) Keep counting the juggle even if not seen airborne for up to this long (ms)
AirEscapeGapMs=1000

