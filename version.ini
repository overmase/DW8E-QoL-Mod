PlayerInfoLevel=1
; (164) 1 = ターゲットした敵の武将の Lv を、左上の敵の武将のゲージの下に出す(F9 で入り切り)。位置は TargetLevelX / TargetLevelY(1280×720、TargetOffset も足す)
