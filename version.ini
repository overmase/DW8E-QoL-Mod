; ============================================================
;  (114) オートセーブ / Auto save
;  月が変わって軍略の画面に戻ると、少しして自動で クイックセーブ(Delete と同じ)をします。戦場から帰った時も月が変わるので保存されます。
;  クイックセーブのファイルが新しくなるたびに(自分で Delete を押した時も)、Savedata\ModAutoSave に日時付きの控えを作ります。
;  古い状態に戻す時は、控えのファイルを QuickSave.dat という名前で Savedata に写してからクイックロードしてください(ゲームを閉じてから)。
;  When the month changes and you are back on the strategy menu, the mod quick-saves automatically. Every quick save is also copied
;  to Savedata\ModAutoSave with a timestamp. To go back, copy a backup over Savedata\QuickSave.dat (with the game closed) and quick-load.
; ============================================================
[AutoSave]
; 1 = オートセーブする / 1 = enable
Enable=1
