; (124) 戦っている敵の武将のゲージ(名前・HP・秘計の印) / Target officer gauge (name, HP, stratagem icons)
TargetOffset=-75,-35
; (124) 拠点の耐久力の枠(城の印と数) / Base durability box (castle icon and number)
BaseOffset=0,-25
; 1 = 強化(アイテムの攻撃・防御・速さ、秘計の攻撃・防御・速さ・攻撃速度・回復・無敵・羅刹・修羅・不動・捕縛)の残り秒数を画面の下に出す。武器の効果は出さない
; 1 = show the remaining seconds of power-ups (items and stratagems) at the bottom of the screen. Weapon effects are not shown
BuffTime=1
; 出す位置(真ん中の横・上の縦、1280×720) / Position (center x, top y, 1280x720)
BuffX=670
BuffY=690
; 1 = 種類の分からない強化も番号で出す(調べる用) / 1 = also show unknown power-up types by number (for research)
BuffShowAll=0

; ============================================================
;  (130) 雑魚が落とすアイテム / Items dropped by soldiers
; ============================================================
[Drop]
; 1 = 争覇の戦場でも雑魚がアイテム(肉まん・老酒・戦神の斧など)を落とす(ゲーム本来は落とさない)。2 = どのモードの戦場でも落とす(レイドなど)。0 = ゲームのまま
; 1 = soldiers also drop items (meat buns, wine, Ares' Axe...) in conquest mode battles (vanilla: no drops). 2 = in every mode (raids etc.). 0 = vanilla
ConquestDrop=1
; 雑魚がアイテムを落とす確率(0〜100 %、どのモードでも)。-1 = ゲームのまま(難易度で 天国 90 / 易しい 75 / 普通 50 / 難しい 25 / 修羅 10 / 5 %)
; Drop chance (0-100 %). -1 = vanilla (by difficulty: 90 / 75 / 50 / 25 / 10 / 5 %)
DropChance=3
; (131) 1 = 雑魚の隊の 2 人目以降もアイテムの乱数を引く(ゲーム本来は 隊の先頭の 1 人だけ)。0 = ゲームのまま
; (131) 1 = every soldier in a squad rolls for an item (vanilla: only the squad leader). 0 = vanilla
AllMembers=1
; (133) 敵武将が兵力が尽きて倒れた時に 武器の箱を落とす確率(0〜100 %、倒し方を問わず)。雑魚が箱を落とす時にも効く。-1 = ゲームのまま(無双乱舞・覚醒乱舞・属性秘計で倒した時だけ落とす)
; (133) Weapon box drop chance (0-100 %) when an enemy officer is defeated for good (out of troops), any kill method. Also applies to soldiers. -1 = vanilla (musou / awakening musou / elemental stratagem kills only)
WeaponDropChance=100
